<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Users | WEBXPAY Analytics Assistant</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <style>
    :root {
      --accent: #F2FF5C;
      --dark: #1A1F24;
      --bg: #f2f4f7;
      --card: #ffffff;
      --text: #111827;
      --muted: #6b7280;
      --border: #e5e7eb;
      --danger: #dc2626;
      --ok: #15803d;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Inter, -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--bg);
      color: var(--text);
    }

    .topbar {
      height: 64px;
      background: #fff;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 24px;
      position: sticky;
      top: 0;
      z-index: 2;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 800;
    }

    .brand img {
      width: 34px;
      height: 34px;
      object-fit: contain;
      background: #000;
      border-radius: 8px;
      padding: 5px;
    }

    .actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    button, .link-btn {
      height: 36px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: #fff;
      color: var(--text);
      font: inherit;
      font-size: 13px;
      font-weight: 700;
      padding: 0 12px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 7px;
      text-decoration: none;
    }

    button.primary {
      background: var(--dark);
      color: #fff;
      border-color: var(--dark);
    }

    button.danger { color: var(--danger); }

    main {
      width: min(1120px, calc(100% - 32px));
      margin: 24px auto;
      display: grid;
      grid-template-columns: 320px 1fr;
      gap: 18px;
      align-items: start;
    }

    .panel {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 8px;
      box-shadow: 0 10px 22px rgba(15, 23, 42, 0.06);
    }

    .panel-head {
      padding: 16px 18px;
      border-bottom: 1px solid var(--border);
    }

    h1, h2 {
      margin: 0;
      letter-spacing: 0;
    }

    h1 { font-size: 18px; }
    h2 { font-size: 15px; }

    .muted {
      color: var(--muted);
      font-size: 13px;
      margin-top: 4px;
    }

    form {
      padding: 18px;
    }

    label {
      display: block;
      font-size: 12px;
      font-weight: 700;
      color: #374151;
      margin: 0 0 6px;
    }

    input, select {
      width: 100%;
      height: 40px;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 0 11px;
      font: inherit;
      margin-bottom: 12px;
      background: #fff;
    }

    input:focus, select:focus {
      outline: none;
      border-color: #a3a900;
      box-shadow: 0 0 0 3px rgba(242, 255, 92, 0.35);
    }

    .msg {
      min-height: 20px;
      padding: 0 18px 16px;
      font-size: 13px;
      color: var(--muted);
    }

    .msg.error { color: var(--danger); }

    .table-wrap {
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
    }

    th, td {
      padding: 12px 14px;
      text-align: left;
      border-bottom: 1px solid var(--border);
      white-space: nowrap;
    }

    th {
      color: #374151;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: .04em;
      background: #f9fafb;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      border-radius: 999px;
      padding: 3px 9px;
      font-size: 11px;
      font-weight: 800;
      background: #eef2ff;
      color: #3730a3;
    }

    .badge.ok {
      background: #dcfce7;
      color: var(--ok);
    }

    .badge.off {
      background: #fee2e2;
      color: var(--danger);
    }

    @media (max-width: 820px) {
      main { grid-template-columns: 1fr; }
      .topbar { padding: 0 14px; }
      .brand span { display: none; }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <img src="static/logo.png" alt="WEBXPAY">
      <span>WEBXPAY Analytics Users</span>
    </div>
    <div class="actions">
      <a href="/" class="link-btn"><i class="fas fa-message"></i> Chat</a>
      <button onclick="logout()"><i class="fas fa-right-from-bracket"></i> Log out</button>
    </div>
  </header>

  <main>
    <section class="panel">
      <div class="panel-head">
        <h2>Create User</h2>
        <div class="muted">Stored in the local SQLite user database.</div>
      </div>
      <form id="create-form">
        <label for="username">Username</label>
        <input id="username" autocomplete="off" required>

        <label for="email">Email</label>
        <input id="email" type="email" autocomplete="off">

        <label for="password">Password</label>
        <input id="password" type="password" autocomplete="new-password" required>

        <label for="role">Role</label>
        <select id="role">
          <option value="user">User</option>
          <option value="admin">Admin</option>
        </select>

        <button class="primary" type="submit"><i class="fas fa-plus"></i> Create</button>
      </form>
      <div class="msg" id="message"></div>
    </section>

    <section class="panel">
      <div class="panel-head">
        <h1>Users</h1>
        <div class="muted" id="summary">Loading...</div>
      </div>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Username</th>
              <th>Email</th>
              <th>Role</th>
              <th>Status</th>
              <th>Last login</th>
              <th></th>
            </tr>
          </thead>
          <tbody id="users-body"></tbody>
        </table>
      </div>
    </section>
  </main>

  <script>
    const body = document.getElementById("users-body");
    const summary = document.getElementById("summary");
    const msg = document.getElementById("message");
    let currentUser = null;

    function esc(value) {
      return String(value ?? "").replace(/[&<>"']/g, c => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#39;"
      }[c]));
    }

    function setMessage(text, isError = false) {
      msg.textContent = text || "";
      msg.classList.toggle("error", isError);
    }

    function fmtDate(value) {
      if (!value) return "-";
      const d = new Date(value);
      return Number.isNaN(d.getTime()) ? value : d.toLocaleString();
    }

    async function loadMe() {
      const res = await fetch("/api/me");
      if (res.status === 401) {
        window.location.href = "/login?next=/users";
        return;
      }
      const data = await res.json();
      currentUser = data.user;
    }

    async function loadUsers() {
      const res = await fetch("/api/users");
      if (res.status === 401) {
        window.location.href = "/login?next=/users";
        return;
      }
      if (res.status === 403) {
        window.location.href = "/";
        return;
      }
      const data = await res.json();
      const users = data.users || [];
      summary.textContent = `${users.length.toLocaleString()} user${users.length === 1 ? "" : "s"}`;
      body.innerHTML = users.map(user => {
        const isSelf = currentUser && currentUser.id === user.id;
        const status = user.is_active
          ? '<span class="badge ok">Active</span>'
          : '<span class="badge off">Inactive</span>';
        const action = isSelf
          ? '<span class="muted">Current user</span>'
          : `<button class="${user.is_active ? "danger" : ""}" onclick="setActive(${user.id}, ${user.is_active ? "false" : "true"})">${user.is_active ? "Deactivate" : "Activate"}</button>`;
        return `
          <tr>
            <td><strong>${esc(user.username)}</strong></td>
            <td>${esc(user.email || "-")}</td>
            <td><span class="badge">${esc(user.role)}</span></td>
            <td>${status}</td>
            <td>${esc(fmtDate(user.last_login_at))}</td>
            <td>${action}</td>
          </tr>
        `;
      }).join("");
    }

    async function setActive(id, isActive) {
      setMessage("");
      const res = await fetch(`/api/users/${id}/status`, {
        method: "PATCH",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ is_active: isActive }),
      });
      const data = await res.json();
      if (!res.ok) {
        setMessage(data.error || "Update failed.", true);
        return;
      }
      await loadUsers();
    }

    document.getElementById("create-form").addEventListener("submit", async event => {
      event.preventDefault();
      setMessage("");
      const payload = {
        username: document.getElementById("username").value.trim(),
        email: document.getElementById("email").value.trim(),
        password: document.getElementById("password").value,
        role: document.getElementById("role").value,
      };
      const res = await fetch("/api/users", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload),
      });
      const data = await res.json();
      if (!res.ok) {
        setMessage(data.error || "Create failed.", true);
        return;
      }
      event.target.reset();
      setMessage("User created.");
      await loadUsers();
    });

    async function logout() {
      try {
        await fetch("/logout", { method: "POST" });
      } catch (_) {}
      window.location.href = "/login";
    }

    (async function init() {
      await loadMe();
      if (currentUser) await loadUsers();
    })();
  </script>
</body>
</html>
